name: Deploy Backend Web

on:
  push:
    branches:
      - deploy
    paths:
      - "web/web/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/thuegiasu-backend
  REMOTE_APP_DIR: ${{ vars.EC2_BACKEND_DEPLOY_DIR || '~/thuegiasu/backend' }}
  BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN || 'edumatch.ooguy.com' }}
  HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL || 'https://edumatch.ooguy.com/actuator/health' }}

jobs:
  deploy:
    name: Build, push and deploy backend to EC2
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create production Dockerfile
        run: |
          cat > web/web/Dockerfile.deploy <<'DOCKERFILE'
          FROM eclipse-temurin:21-jdk AS build
          WORKDIR /app
          COPY . .
          RUN chmod +x mvnw && ./mvnw -B -DskipTests clean package

          FROM eclipse-temurin:21-jre
          WORKDIR /app
          RUN useradd --system --create-home spring
          COPY --from=build /app/target/*.jar app.jar
          RUN mkdir -p /app/uploads && chown -R spring:spring /app
          USER spring
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "/app/app.jar"]
          DOCKERFILE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "sha_tag=${IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./web/web
          file: ./web/web/Dockerfile.deploy
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" \
            | tr -d '\r' > ~/.ssh/ec2_backend_key
          chmod 600 ~/.ssh/ec2_backend_key
          ssh-keyscan -T 10 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare deployment files
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail

          cat > .env.deploy <<'ENV_FILE'
          ${{ secrets.BACKEND_ENV_FILE }}
          ENV_FILE
          sed -i 's/^[[:space:]]*//' .env.deploy
          sed -i 's/\r$//' .env.deploy
          test -s .env.deploy

          cat > docker-compose.backend.yml <<'COMPOSE_FILE'
          services:
            backend:
              image: ${BACKEND_IMAGE}
              container_name: thuegiasu-backend
              restart: unless-stopped
              env_file:
                - .env
              ports:
                - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
              volumes:
                - backend_uploads:/app/uploads

            caddy:
              image: caddy:2-alpine
              container_name: thuegiasu-caddy
              restart: unless-stopped
              depends_on:
                - backend
              environment:
                BACKEND_DOMAIN: ${BACKEND_DOMAIN}
              ports:
                - "80:80"
                - "443:443"
                - "443:443/udp"
              volumes:
                - ./Caddyfile:/etc/caddy/Caddyfile:ro
                - caddy_data:/data
                - caddy_config:/config

          volumes:
            backend_uploads:
            caddy_data:
            caddy_config:
          COMPOSE_FILE

          cat > Caddyfile <<'CADDY_FILE'
          {$BACKEND_DOMAIN} {
            encode zstd gzip
            reverse_proxy backend:8080
          }
          CADDY_FILE

          printf '%s\n' "$DEPLOY_IMAGE" > .backend-image
          printf '%s\n' "$BACKEND_DOMAIN" > .backend-domain

      - name: Validate environment variables against .env.example
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_KEYS=$(grep -oP '^[A-Z_]+(?==)' web/web/.env.example || true)

          if [ -z "$REQUIRED_KEYS" ]; then
            echo "Could not parse .env.example; skipping validation."
            exit 0
          fi

          MISSING=()
          while IFS= read -r key; do
            if ! grep -q "^${key}=" .env.deploy; then
              MISSING+=("$key")
            fi
          done <<< "$REQUIRED_KEYS"

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "The following required environment variables are missing from BACKEND_ENV_FILE:" >&2
            printf '  - %s\n' "${MISSING[@]}" >&2
            echo "Please add them to the GitHub secret BACKEND_ENV_FILE or update web/web/.env.example." >&2
            exit 1
          fi

          echo "All required environment variables from .env.example are present."

      - name: Upload deployment files to EC2
        shell: bash
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/ec2_backend_key \
            docker-compose.backend.yml Caddyfile .env.deploy .backend-image .backend-domain \
            "${EC2_USER}@${EC2_HOST}:/tmp/"

      - name: Deploy on EC2
        shell: bash
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$DOCKER_PASSWORD" | ssh -i ~/.ssh/ec2_backend_key \
            "${EC2_USER}@${EC2_HOST}" \
            "docker login '${REGISTRY}' -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin >/dev/null"

          ssh -i ~/.ssh/ec2_backend_key "${EC2_USER}@${EC2_HOST}" \
            "REMOTE_APP_DIR='${REMOTE_APP_DIR}' HEALTHCHECK_URL='${HEALTHCHECK_URL}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          case "$REMOTE_APP_DIR" in
            "~") REMOTE_APP_DIR="$HOME" ;;
            "~/"*) REMOTE_APP_DIR="$HOME/${REMOTE_APP_DIR:2}" ;;
          esac

          mkdir -p "$REMOTE_APP_DIR"
          mv /tmp/docker-compose.backend.yml "$REMOTE_APP_DIR/docker-compose.backend.yml"
          mv /tmp/.env.deploy "$REMOTE_APP_DIR/.env"
          mv /tmp/.backend-image "$REMOTE_APP_DIR/.backend-image"
          mv /tmp/.backend-domain "$REMOTE_APP_DIR/.backend-domain"
          mv /tmp/Caddyfile "$REMOTE_APP_DIR/Caddyfile"
          chmod 600 "$REMOTE_APP_DIR/.env"

          cd "$REMOTE_APP_DIR"
          export BACKEND_IMAGE BACKEND_DOMAIN
          BACKEND_IMAGE="$(cat .backend-image)"
          BACKEND_DOMAIN="$(cat .backend-domain)"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE=(docker compose)
          elif docker-compose version >/dev/null 2>&1; then
            COMPOSE=(docker-compose)
          else
            echo "Docker Compose is not installed on EC2." >&2
            echo "Install it on the server, then rerun this workflow." >&2
            exit 1
          fi

          "${COMPOSE[@]}" version

          "${COMPOSE[@]}" -f docker-compose.backend.yml config >/dev/null
          "${COMPOSE[@]}" -f docker-compose.backend.yml pull backend caddy
          "${COMPOSE[@]}" -f docker-compose.backend.yml up -d --remove-orphans backend caddy

          echo "Waiting for backend to become healthy..."
          for attempt in $(seq 1 30); do
            if curl -fsS "$HEALTHCHECK_URL" >/dev/null; then
              echo "Backend health check passed."
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "Backend health check failed: $HEALTHCHECK_URL" >&2
          "${COMPOSE[@]}" -f docker-compose.backend.yml logs --tail=200 backend >&2
          "${COMPOSE[@]}" -f docker-compose.backend.yml logs --tail=200 caddy >&2
          exit 1
          REMOTE_SCRIPT

      - name: Notify Slack on failure
        if: failure()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            --data "{\"text\":\"Backend deployment failed for ${GITHUB_REPOSITORY}@${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL" >/dev/null